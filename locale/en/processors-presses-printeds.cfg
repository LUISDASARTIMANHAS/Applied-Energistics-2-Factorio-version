# PRESS
silicon-press=Required to make the various processors with the Inscriber. Found in the Sky Stone Chest that appears on meteorites during world generation and can be copied using the Inscriber.

logic-processor-press=Required to make Printed Logic Circuit Boards with the Inscriber. Found in the Sky Stone Chest that appears on meteorites during world generation and can be copied using the Inscriber.

calculation-processor-press=Required to make Printed Calculation Circuit Boards with the Inscriber. Found in the Sky Stone Chest that appears on meteorites during world generation and can be copied using the Inscriber.

engineering-processor-press=Required to make Printed Engineering Circuit Boards with the Inscriber. Found in the Sky Stone Chest that appears on meteorites during world generation and can be copied using the Inscriber.


# PRINTED CIRCUITS
printed-silicon=printed silicon
